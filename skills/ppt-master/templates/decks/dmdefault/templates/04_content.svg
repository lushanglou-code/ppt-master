<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1280" height="720" viewBox="0 0 1280 720"
  data-pptx-master="dameng_content_master" data-pptx-master-name="Dameng Content Master"
  data-pptx-layout="content" data-pptx-layout-name="Open Content Slide">
  <defs>
    <linearGradient id="ggrad-red" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#FF0000" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF0000"/>
    </linearGradient>
    <linearGradient id="ggrad-blue" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#265EFA" stop-opacity="0"/>
      <stop offset="1" stop-color="#0101D2"/>
    </linearGradient>
  </defs>

  <!-- Master Layer: Background & Header Logo -->
  <image id="content-master-bg" x="0" y="0" width="1280" height="720"
    href="../images/content_bg.png" preserveAspectRatio="none"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <image id="content-master-logo" x="1039" y="49" width="220" height="35"
    href="../images/brand_logo.png" preserveAspectRatio="none"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <!-- Master Layer: Title Header Signature Accents (Root-level atomic shapes) -->
  <rect id="content-accent-red" x="56.14" y="32.74" width="11.67" height="42.88"
    fill="url(#ggrad-red)" stroke="none"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="content-accent-blue" x="35.67" y="46.49" width="11.67" height="29.13"
    fill="url(#ggrad-blue)" stroke="none"
    data-pptx-layer="master" data-pptx-editable="false"/>

  <!-- Master Layer: Footer -->
  <text id="content-footer-slogan" x="45" y="695"
    fill="#A6A6A6" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif"
    font-size="16"
    data-pptx-layer="master" data-pptx-editable="false">打造中国的世界级数据库品牌</text>
  <text id="content-footer-url" x="1108" y="695"
    fill="#A6A6A6" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif"
    font-size="16"
    data-pptx-layer="master" data-pptx-editable="false">www.dameng.com</text>

  <!-- Layout Layer: Title Slot -->
  <g id="content-title-slot" data-pptx-placeholder="title" data-pptx-bounds="78 28 940 60">
    <text id="content-title-carrier" data-pptx-carrier="true"
      x="80" y="69"
      fill="#000000" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif"
      font-size="40" font-weight="700">{{PAGE_TITLE}}</text>
  </g>

  <!-- Layout Layer: Open Content Viewport (Unconstrained for arbitrary layouts) -->
  <g id="content-body-viewport" data-pptx-placeholder="object" data-pptx-idx="2" data-pptx-bounds="70 110 1140 550">
    <!-- Open content area: Executor has full freedom to render cards, diagrams, tables, metrics, etc. -->
    <text id="content-body-carrier" data-pptx-carrier="true"
      x="80" y="150"
      fill="#A6A6A6" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif"
      font-size="20">{{CONTENT_AREA}}</text>
  </g>
</svg>
