  <text id="toc-icon-text-2" x="95" y="325" text-anchor="middle"
    fill="#FFFFFF" font-family="Arial, sans-serif" font-size="12" font-weight="700"
    data-pptx-layer="layout" data-pptx-editable="false">Ex</text>

  <!-- Item 3 Icon Badge -->
  <circle id="toc-icon-bg-3" cx="95" cy="420" r="28" fill="url(#ggrad-icon-circle)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <ellipse id="toc-icon-glyph-3-head" cx="95" cy="410" rx="12" ry="4" fill="#FFFFFF"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <path id="toc-icon-glyph-3-body1" d="M 83 410 L 83 416 C 83 418.5 88.4 420 95 420 C 101.6 420 107 418.5 107 416 L 107 410"
    fill="none" stroke="#FFFFFF" stroke-width="2"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <path id="toc-icon-glyph-3-body2" d="M 83 416 L 83 422 C 83 424.5 88.4 426 95 426 C 101.6 426 107 424.5 107 422 L 107 416"
    fill="none" stroke="#FFFFFF" stroke-width="2"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <path id="toc-icon-glyph-3-body3" d="M 83 422 L 83 428 C 83 430.5 88.4 432 95 432 C 101.6 432 107 430.5 107 428 L 107 422"
    fill="none" stroke="#FFFFFF" stroke-width="2"
    data-pptx-layer="layout" data-pptx-editable="false"/>

  <!-- Item 4 Icon Badge -->
  <circle id="toc-icon-bg-4" cx="95" cy="520" r="28" fill="url(#ggrad-icon-circle)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <circle id="toc-icon-glyph-4-ring" cx="95" cy="520" r="13" fill="none" stroke="#FFFFFF" stroke-width="2"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <text id="toc-icon-text-4" x="95" y="525" text-anchor="middle" fill="#FFFFFF"
    font-family="'Microsoft YaHei', sans-serif" font-size="12" font-weight="700"
    data-pptx-layer="layout" data-pptx-editable="false">企</text>

  <!-- 3. Layout Layer: Slots for Each TOC Item -->
  <g id="toc-item-1-slot" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="140 195 960 50">
    <text id="toc-item-1-carrier" data-pptx-carrier="true"
      x="140" y="228"
      fill="#000000" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif"
      font-size="26" font-weight="600">{{TOC_ITEM_1}}</text>
  </g>
  <g id="toc-item-2-slot" data-pptx-placeholder="body" data-pptx-idx="2" data-pptx-bounds="140 295 960 50">
    <text id="toc-item-2-carrier" data-pptx-carrier="true"
      x="140" y="328"
      fill="#000000" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif"
      font-size="26" font-weight="600">{{TOC_ITEM_2}}</text>
  </g>
  <g id="toc-item-3-slot" data-pptx-placeholder="body" data-pptx-idx="3" data-pptx-bounds="140 395 960 50">
    <text id="toc-item-3-carrier" data-pptx-carrier="true"
      x="140" y="428"
      fill="#000000" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif"
      font-size="26" font-weight="600">{{TOC_ITEM_3}}</text>
  </g>
  <g id="toc-item-4-slot" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="140 495 960 50">
    <text id="toc-item-4-carrier" data-pptx-carrier="true"
      x="140" y="528"
      fill="#000000" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif"
      font-size="26" font-weight="600">{{TOC_ITEM_4}}</text>
  </g>
</svg>
